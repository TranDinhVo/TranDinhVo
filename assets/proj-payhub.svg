<svg xmlns="http://www.w3.org/2000/svg" width="190" height="200" viewBox="0 0 190 200">
<style>
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ping{0%{r:3;opacity:.8}100%{r:11;opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
@keyframes bracket{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}
.up{opacity:0;animation:up .6s ease-out forwards}
.in{opacity:0;animation:fade .6s ease-out forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.br{stroke-dasharray:28;stroke-dashoffset:28;animation:bracket .7s ease-out forwards}
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6ebf3" stroke-width="1"/>
  </pattern>
</defs>
<rect width="190" height="200" rx="6" fill="#fbfcfe"/>
<rect width="190" height="200" rx="6" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="189" height="199" rx="6" fill="none" stroke="#cfd8e6"/>
<g fill="none" stroke="#0f172a" stroke-width="1.5">
  <path class="br" d="M10 24 V10 H24"/>
  <path class="br" style="animation-delay:.1s" d="M166 10 H180 V24"/>
  <path class="br" style="animation-delay:.2s" d="M10 176 V190 H24"/>
  <path class="br" style="animation-delay:.3s" d="M166 190 H180 V176"/>
</g>
<defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path class="br" d="M178 1 H189 V12" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
<path class="br" d="M178 199 H189 V188" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
<path class="pulse" d="M14 14 l4 4 -4 4 -4 -4z" fill="#7c3aed"/>
<text class="in" style="animation-delay:0.3s" x="24" y="21" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="7.5" fill="#64748b" text-anchor="start" letter-spacing="1.5">P02</text>
<g class="in" style="animation-delay:0.5s">
<rect x="109" y="10" width="67" height="15" rx="7.5" fill="#fff" stroke="#d97706"/>
<circle cx="117" cy="17.5" r="2" fill="#d97706"/>
<text x="146.5" y="21" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="7" fill="#d97706" text-anchor="middle" letter-spacing="1">PRIVATE</text>
</g>
<g class="up" style="animation-delay:0.4s">
<rect x="16" y="34" width="158" height="92" rx="4" fill="#fff" stroke="#cfd8e6"/>
<rect x="16" y="34" width="158" height="14" rx="4" fill="#7c3aed" opacity="0.9"/>
<rect x="16" y="44" width="158" height="4" fill="#7c3aed" opacity="0.9"/>
<circle cx="24" cy="41" r="2" fill="#fff" opacity="0.8"/>
<circle cx="32" cy="41" r="2" fill="#fff" opacity="0.8"/>
<circle cx="40" cy="41" r="2" fill="#fff" opacity="0.8"/>
<rect x="24" y="56" width="34" height="62" rx="2" fill="#7c3aed" opacity="0.12"/>
<rect class="grow" style="animation-delay:0.70s" x="66" y="60" width="60" height="6" rx="2" fill="#7c3aed" opacity="0.5"/>
<rect class="grow" style="animation-delay:0.80s" x="66" y="72" width="80" height="6" rx="2" fill="#7c3aed" opacity="0.3"/>
<rect class="grow" style="animation-delay:0.90s" x="66" y="84" width="45" height="6" rx="2" fill="#7c3aed" opacity="0.3"/>
<rect class="grow" style="animation-delay:1.00s" x="66" y="96" width="70" height="6" rx="2" fill="#7c3aed" opacity="0.2"/>
<rect class="grow" style="animation-delay:1.10s" x="66" y="108" width="50" height="6" rx="2" fill="#7c3aed" opacity="0.3"/>
<clipPath id="mock"><rect x="16" y="34" width="158" height="92" rx="4"/></clipPath>
<g clip-path="url(#mock)"><rect x="16" y="34" width="40" height="92" fill="url(#shine)" style="animation:shimmer 2.8s ease-in-out 1.3s infinite" transform="skewX(-20)"/></g>
</g>
<text class="up" style="animation-delay:0.8s" x="16" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0f172a">PayHub</text>
<text class="up" style="animation-delay:0.8999999999999999s" x="16" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" fill="#64748b">PayPal order management</text>
<text class="up" style="animation-delay:1.0s" x="16" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#7c3aed" letter-spacing="0.5">NestJS · Next.js · Prisma</text>
</svg>