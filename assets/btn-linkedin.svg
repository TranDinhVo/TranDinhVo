<svg xmlns="http://www.w3.org/2000/svg" width="180" height="50" viewBox="0 0 180 50">
<style>
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ping{0%{r:3;opacity:.8}100%{r:11;opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
@keyframes bracket{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}
.up{opacity:0;animation:up .6s ease-out forwards}
.in{opacity:0;animation:fade .6s ease-out forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.br{stroke-dasharray:28;stroke-dashoffset:28;animation:bracket .7s ease-out forwards}

@keyframes sweep{0%{transform:translateX(-120px)}30%,100%{transform:translateX(260px)}}
.sweep{animation:sweep 4s ease-in-out 0s infinite}
</style>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6ebf3" stroke-width="1"/></pattern>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".12"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="180" height="50" rx="6"/></clipPath></defs>
<rect width="180" height="50" rx="6" fill="#fbfcfe"/><rect width="180" height="50" rx="6" fill="url(#grid)"/>
<g clip-path="url(#clip)"><rect class="sweep" x="0" y="0" width="80" height="50" fill="url(#sw)" transform="skewX(-20)"/></g>
<rect x="0.5" y="0.5" width="179" height="49" rx="6" fill="none" stroke="#cfd8e6"/>
<path class="br" d="M168 1 H179 V12" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.6"/>
<g class="up" transform="translate(22 13)"><path fill="#0A66C2" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></g>
<text class="up" style="animation-delay:.15s" x="58" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#0f172a" letter-spacing="2">LINKEDIN</text>
</svg>