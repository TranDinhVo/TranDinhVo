<svg xmlns="http://www.w3.org/2000/svg" width="800" height="248" viewBox="0 0 800 248">
<style>
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ping{0%{r:3;opacity:.8}100%{r:11;opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
@keyframes bracket{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}
.up{opacity:0;animation:up .6s ease-out forwards}
.in{opacity:0;animation:fade .6s ease-out forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.br{stroke-dasharray:28;stroke-dashoffset:28;animation:bracket .7s ease-out forwards}
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e6ebf3" stroke-width="1"/>
  </pattern>
</defs>
<rect width="800" height="248" rx="6" fill="#fbfcfe"/>
<rect width="800" height="248" rx="6" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="799" height="247" rx="6" fill="none" stroke="#cfd8e6"/>
<g fill="none" stroke="#0f172a" stroke-width="1.5">
  <path class="br" d="M10 24 V10 H24"/>
  <path class="br" style="animation-delay:.1s" d="M776 10 H790 V24"/>
  <path class="br" style="animation-delay:.2s" d="M10 224 V238 H24"/>
  <path class="br" style="animation-delay:.3s" d="M776 238 H790 V224"/>
</g>
<text class="up" x="400.0" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="1">TRAN DINH VO</text>
<g class="up" style="animation-delay:.2s">
<rect x="325.0" y="74" width="150" height="20" rx="10" fill="#fff" stroke="#cfd8e6"/>
<circle class="pulse" cx="339.0" cy="84" r="3" fill="#d97706"/>
<text x="406.0" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">GITHUB  ·  4 FOLLOWERS</text>
</g>
<line class="grow" style="animation-delay:.4s" x1="370.0" y1="106" x2="430.0" y2="106" stroke="#2563eb" stroke-width="2"/>
<defs><clipPath id="typeclip"><rect x="302.0" y="112" height="24" width="0"><animate attributeName="width" from="0" to="196.0" begin="0.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1"/></rect></clipPath></defs>
<g clip-path="url(#typeclip)"><text x="400.0" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle" letter-spacing="1">FULL-STACK DEVELOPER</text></g>
<rect class="blink" style="animation-delay:1.7s" x="304.0" y="118" width="2" height="16" fill="#2563eb" opacity="0"><animate attributeName="x" from="304.0" to="496.0" begin="0.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1"/><animate attributeName="opacity" to="1" begin="0.6s" dur="0.05s" fill="freeze"/></rect>
<text class="in" style="animation-delay:1.9s" x="400.0" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8.5" fill="#2563eb" text-anchor="middle" letter-spacing="2">BACKEND  ·  FRONTEND  ·  DATABASE DESIGN</text>
<line class="grow" style="animation-delay:.5s;animation-duration:1.2s" x1="160" y1="186" x2="640" y2="186" stroke="#cfd8e6" stroke-width="1.5"/>
<g class="in" style="animation-delay:0.7s">
<circle cx="160" cy="186" r="5" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
<text x="160" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">CODE</text>
</g>
<g class="in" style="animation-delay:0.95s">
<circle cx="320" cy="186" r="5" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
<text x="320" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">BUILD</text>
</g>
<g class="in" style="animation-delay:1.2s">
<circle cx="480" cy="186" r="5" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
<text x="480" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">SHIP</text>
</g>
<g class="in" style="animation-delay:1.45s">
<circle cx="640" cy="186" r="5" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
<text x="640" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1.5">RUN</text>
</g>
<circle cy="186" r="4" fill="#d97706" opacity="0"><animate attributeName="opacity" to="1" begin="1.8s" dur="0.3s" fill="freeze"/><animate attributeName="cx" begin="1.8s" dur="6s" repeatCount="indefinite" calcMode="spline" values="160;160;320;320;480;480;640;640;160" keyTimes="0;.15;.3;.45;.6;.75;.9;.97;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/><animate attributeName="fill" begin="1.8s" dur="6s" repeatCount="indefinite" values="#d97706;#d97706;#2563eb;#2563eb;#7c3aed;#7c3aed;#16a34a;#16a34a;#d97706" keyTimes="0;.15;.3;.45;.6;.75;.9;.97;1"/></circle>
<circle cy="186" r="4" fill="none" stroke="#2563eb" opacity="0"><animate attributeName="cx" begin="1.8s" dur="6s" repeatCount="indefinite" calcMode="spline" values="160;160;320;320;480;480;640;640;160" keyTimes="0;.15;.3;.45;.6;.75;.9;.97;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/><animate attributeName="r" values="4;12" begin="1.8s" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" begin="1.8s" dur="1.5s" repeatCount="indefinite"/></circle>
<text x="400.0" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#16a34a" text-anchor="middle" letter-spacing="2" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.3;.38;1" begin="2s" dur="9s" repeatCount="indefinite"/>LEARNING  ·  BUILDING  ·  GROWING</text>
<text x="400.0" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#16a34a" text-anchor="middle" letter-spacing="2" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.3;.38;1" begin="5s" dur="9s" repeatCount="indefinite"/>OPEN TO INTERNSHIP OPPORTUNITIES</text>
<text x="400.0" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#16a34a" text-anchor="middle" letter-spacing="2" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.3;.38;1" begin="8s" dur="9s" repeatCount="indefinite"/>SPRING BOOT  ·  NESTJS  ·  NEXT.JS</text>
</svg>